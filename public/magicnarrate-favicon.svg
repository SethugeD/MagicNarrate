<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="mGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#a855f7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ec4899;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Large M letter -->
  <text x="32" y="50" font-family="Arial, sans-serif" font-size="56" font-weight="900" text-anchor="middle" fill="url(#mGrad)" letter-spacing="-2">M</text>
  
  <!-- Book on left side of M -->
  <g transform="translate(8, 18)">
    <rect x="0" y="0" width="8" height="14" fill="#a855f7" stroke="#ec4899" stroke-width="0.8" rx="1"/>
    <rect x="3.5" y="0" width="8" height="14" fill="#c084fc" stroke="#a855f7" stroke-width="0.8" rx="1"/>
    <line x1="3.5" y1="0" x2="3.5" y2="14" stroke="#7c3aed" stroke-width="0.8"/>
    <line x1="2" y1="2" x2="5.5" y2="2" stroke="white" stroke-width="0.5" opacity="0.6"/>
    <line x1="2" y1="4" x2="5.5" y2="4" stroke="white" stroke-width="0.5" opacity="0.5"/>
    <line x1="2" y1="6" x2="5" y2="6" stroke="white" stroke-width="0.5" opacity="0.4"/>
  </g>
  
  <!-- Wand on right side -->
  <line x1="52" y1="10" x2="56" y2="22" stroke="url(#mGrad)" stroke-width="2.5" stroke-linecap="round"/>
  
  <!-- Wand star tip -->
  <polygon points="56,22 57,25 60.5,25.5 57.5,28 58.5,31.5 56,29 53.5,31.5 54.5,28 51.5,25.5 55,25" fill="#fbbf24"/>
  
  <!-- Sparkles around -->
  <circle cx="18" cy="12" r="1.2" fill="#fbbf24" opacity="0.8"/>
  <circle cx="48" cy="35" r="1" fill="#ec4899" opacity="0.7"/>
</svg>
